<style>
body{
    position: relative;

body::before{

}

.header{

}

.container{

.page{

.option{

button:hover{

}
button:active{

}

.result-box{
    background:#fafafa;

    border-radius:12px;

}

.thinking-box{
    font: size 18px;
    color:#ff6b9d;
    text-align:center;
    padding:20px;

}
@keyframes dots{
    0%{content:'';}
    50%{content:'.';}

#nutritionChart{
    width:100%;
    height:420px;
    background:#fff;

.tip-text{

/* 蔬菜区域 */
#veggie-world{
    position:fixed;
    bottom:0;
    left:0;

    width:100%;
    height:203px;

    overflow:hidden;

    pointer-events:none;

    z-index:5;
}

/* 单个蔬菜 */
.veggie{
    position:absolute;
    font-size:40px;
    user-select:none;
}

/* 摇一摇按钮 */
#shakeBtn{
    position: absolute;

    right:20px;
    bottom:40px;

    z-index:999;

    border:none;

    padding:12px 12px;

    border-radius:50px;

    cursor:pointer;

    background:#fff1d16e;
    color:white;
    font-size:33px;
}

/* 包裹容器 */
.shake-wrapper{
    position:fixed;
    right:30px;
    bottom:30px;
    z-index:9999;
}

/* 提示文字 */
.shake-tip{
    position:absolute;

    right:85px;
    top:50%;

    transform:
        translateY(-50%)
        translateX(10px);

    white-space:nowrap;

    background:rgba(50,50,50,0.9);

    color:white;

    padding:8px 12px;

    border-radius:12px;

    font-size:14px;

    opacity:0;

    pointer-events:none;

    transition:all .3s ease;
}

/* 小三角 */
.shake-tip::after{
    content:"";

    position:absolute;

    right:-6px;
    top:50%;

    transform:translateY(-50%);

    border-left:6px solid rgba(50,50,50,0.9);
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
}

/* 鼠标悬停显示 */
.shake-wrapper:hover .shake-tip{

    opacity:1;

    transform:
        translateY(-50%)
        translateX(0);
}

.welcome-page{

    padding:20px;
    background:#fff1d183;
    border-radius:24px;

#recipeloading{

#thinkingVideo{

#nutritionLoading{

#saveCardBtn{

#saveCardBtn:hover{

#shareCard{

#shareCard > h2{

.card-subtitle{

.card-footer{

    text-align:center;

}

.action-area{
    text-align: center;
    margin-top: 20px;
}


</style>

<script>
let recipeText='';
let nutritionText='';

/*
function nextPage(n){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('page'+n).classList.add('active');
}
 */
function nextPage(n){

    document.querySelectorAll('.page')
        .forEach(p=>p.classList.remove('active'));

    const page = document.getElementById('page'+n);

    page.classList.add('active');

    page.animate(
        [
            {
                opacity:0,
                transform:'translateX(50px)'
            },
            {
                opacity:1,
                transform:'translateX(0)'
            }
        ],
        {
            duration:400,
            easing:'ease-out'
        }
    );
}

async function generateRecipe(){

    const taste =
        document.querySelector(
            'input[name="taste"]:checked'
        )?.value || '';

    const avoid =
        document.getElementById(
            'avoid'
        ).value || '无';

    const allergy =
        document.getElementById(
            'allergy'
        ).value || '无';

    const goal =
        document.querySelector(
            'input[name="goal"]:checked'
        )?.value || '';

    const prompt =
        `偏好口味:${taste}；忌口:${avoid}；过敏原:${allergy}；健康目标:${goal}。请先生成食谱推荐，并单独给出营养分析。`;

    // 立即进入加载页
    nextPage(5);

    document.getElementById(
        'recipeLoading'
    ).style.display = 'block';

    document.getElementById(
        'recipeResult'
    ).style.display = 'none';

    document.getElementById(
        'nextBtn'
    ).style.display = 'none';

    try{

        const response =
            await fetch(
                '/api/chat',
                {
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        message:prompt
                    })
                }
            );

        const data =
            await response.json();

        const txt =
            data.response || '';

        console.log('data response：');
        console.log(txt);

        const parts =
            txt.split(/营养分析[:：]/);

        recipeText =
            parts[0] || txt;

        nutritionText =
            parts.length > 1
                ? ('营养分析：'+parts[1])
                : '未检测到营养分析内容';

        // 隐藏视频
        document.getElementById(
            'recipeLoading'
        ).style.display = 'none';

        // 显示结果
        document.getElementById(
            'recipeResult'
        ).style.display = 'block';

        document.getElementById(
            'nextBtn'
        ).style.display = 'inline-block';

        document.getElementById(
            'recipeResult'
        ).innerHTML =
            marked.parse(recipeText);



    }
    catch(e){

        document.getElementById(
            'recipeLoading'
        ).style.display = 'none';

        document.getElementById(
            'recipeResult'
        ).style.display = 'block';

        document.getElementById(
            'recipeResult'
        ).innerHTML =
            '生成失败';
    }
}

async function loadNutrition(){

    try{

        const loading =
            document.getElementById(
                'nutritionLoading'
            );

        const result =
            document.getElementById(
                'nutritionResult'
            );

        // 显示动画
        loading.style.display = 'block';

        // 隐藏结果
        result.style.display = 'none';

        // 隐藏按钮
        document.getElementById(
            "saveCardBtn"
        ).style.display="none";

        const response = await fetch(
            '/api/nutrition',
            {
                method:'POST'
            }
        );

        const data = await response.json();
        console.log(data.nutrition);

        // 隐藏动画
        loading.style.display = 'none';

        // 显示结果
        result.style.display = 'block';

        // 显示按钮
        document.getElementById(
            "saveCardBtn"
        ).style.display="inline-block";

        document.getElementById(
            'nutritionText'//////////////////////////////
        ).innerHTML =
            marked.parse(
                data.nutrition || '暂无数据'
            );
        //renderNutritionChart(35,18,60,12,620);
        
        const nutrition =
             extractNutrition(
             data.nutrition || ''
        );
        console.log(nutrition);

        renderNutritionChart(
            nutrition.protein,
            nutrition.fat,
            nutrition.carb,
            nutrition.fiber,
            nutrition.kcal
        );
        renderNutritionCompareChart(
            nutrition.protein,
            nutrition.fat,
            nutrition.carb,
            nutrition.fiber,
            nutrition.kcal
        );

    }catch(e){

        document.getElementById(
            'nutritionLoading'
        ).style.display = 'none';

        document.getElementById(
            'nutritionResult'
        ).style.display = 'block';
        document.getElementById(
            "saveCardBtn"
        ).style.display="inline-block";

        document.getElementById(
            'nutritionResult'
        ).innerHTML =
            '营养分析生成失败';

    }
}
async function goNutrition(){

    nextPage(6);
    await loadNutrition();
}

function renderNutritionChart(
    protein,
    fat,
    carb,
    fiber,
    kcal
){

    const chart =
        echarts.init(
            document.getElementById(
                'nutritionChart'
            )
        );

    const option = {

        color:[
            '#7BC96F',
            '#F6C453',
            '#FF8A65',
            '#64B5F6'
        ],

        tooltip:{
            trigger:'item',
            formatter:
                '{b}<br>{c}g ({d}%)'
        },

        title:{
            text:
                kcal + '\nkcal',

            left:'center',
            top:'42%',

            textStyle:{
                fontSize:24,
                fontWeight:'bold'
            }
        },

        legend:{
            bottom:10,
            selectedMode:false
        },

        series:[
            {
                type:'pie',

                radius:[
                    '55%',
                    '75%'
                ],

                itemStyle:{
                    borderRadius:10,
                    borderColor:'#fff',
                    borderWidth:4
                },

                label:{
                    formatter:
                        '{b}\n{d}%'
                },

                data:[
                    {
                        value:protein,
                        name:'蛋白质'
                    },
                    {
                        value:fat,
                        name:'脂肪'
                    },
                    {
                        value:carb,
                        name:'碳水'
                    },
                    {
                        value:fiber,
                        name:'膳食纤维'
                    }
                ]
            }
        ]
    };

    chart.setOption(option);

    window.addEventListener(
        'resize',
        ()=>chart.resize()
    );
}

function renderNutritionCompareChart(
    protein,
    fat,
    carb,
    fiber
){

    const chart = echarts.init(
        document.getElementById(
            'nutritionCompareChart'
        )
    );

    const currentData = [
        protein,
        fat,
        carb,
        fiber
    ];

    const recommendData = [
        25,
        20,
        75,
        10
    ];

    const names = [
        '蛋白质',
        '脂肪',
        '碳水',
        '膳食纤维'
    ];

    const option = {

        title:{
            text:'当前菜谱与推荐摄入对比',
            left:'center'
        },

        tooltip:{

            trigger:'axis',

            axisPointer:{
                type:'shadow'
            },

            formatter:function(params){

                const index =
                    params[0].dataIndex;

                const current =
                    currentData[index];

                const recommend =
                    recommendData[index];

                const diff =
                    current - recommend;

                return `
                    <b>${names[index]}</b><br/>
                    当前菜谱：${current.toFixed(1)}g<br/>
                    推荐摄入：${recommend.toFixed(1)}g<br/>
                    差值：${diff>0?'+':''}${diff.toFixed(1)}g
                `;
            }
        },

        legend:{
            bottom:10,
            selectedMode:false
        },

        xAxis:{
            type:'category',
            data:names
        },

        yAxis:{
            type:'value',
            name:'克(g)'
        },

        series:[
            {
                name:'当前菜谱',
                type:'bar',
                data:currentData
            },
            {
                name:'推荐摄入',
                type:'bar',
                data:recommendData
            }
        ]
    };

    chart.setOption(option);

    window.addEventListener(
        'resize',
        ()=>chart.resize()
    );
}

function extractNutrition(text){

    const nutritionPart =
        text.split("### ⭐")[0];

    console.log("营养区块：");
    console.log(nutritionPart);

    console.log("原始营养分析：");
    console.log(text);

    return {

        kcal:Number(
    nutritionPart.match(/热量.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"calories"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/calories.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
),
protein:Number(
    nutritionPart.match(/蛋白质.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"protein"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/protein.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
),
carb:Number(
    nutritionPart.match(/碳水化合物.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"carbs"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/carbs.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
),
fat:Number(
    nutritionPart.match(/脂肪.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"fat"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/fat.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
),
fiber:Number(
    nutritionPart.match(/膳食纤维.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"fiber"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/fiber.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
)
    };

}

/*Matter.js 蔬菜重力系统*/
// 所有蔬菜物理体
let veggieBodies = [];

// Matter引擎
let engine;

// Matter世界
let world;

/*页面加载完成后启动*/
window.addEventListener("load", () => {

    initVeggieWorld();

});


/*初始化蔬菜世界*/
function initVeggieWorld(){

    // Matter模块
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const Runner = Matter.Runner;
    const Bodies = Matter.Bodies;
    const Composite = Matter.Composite;

    // 创建引擎
    engine = Engine.create();

    world = engine.world;

    // 创建渲染器
    const render = Render.create({

        element: document.getElementById("veggie-world"),

        engine: engine,

        options: {
            width: window.innerWidth,
            height: 220,
            wireframes: false,
            background: "transparent"
        }
    });

    // 启动渲染
    Render.run(render);

    // 启动物理计算
    const runner = Runner.create();

    Runner.run(runner, engine);

    /*创建地板*/
    const ground = Bodies.rectangle(
        window.innerWidth / 2,
        223,
        window.innerWidth,
        40,
        {
            isStatic: true
        }
    );

    Composite.add(world, ground);

    /*创建左右墙壁*/
    const leftWall = Bodies.rectangle(
        -20,
        110,
        40,
        220,
        {
            isStatic: true
        }
    );

    const rightWall = Bodies.rectangle(
        window.innerWidth + 20,
        110,
        40,
        220,
        {
            isStatic: true
        }
    );

    Composite.add(world, [leftWall, rightWall]);

    /*蔬菜种类*/
    const veggies = [
        "🥕",
        "🥦",
        "🍅",
        "🥔",
        "🥑",
        "🥬",
        "🧅",
        "🍆",
        "🍐",
        "🍠",
        "🍋",
        "🍊",
        "🍇",
        "🍈",
        "🍉", 
        "🧀",
        "🥥",
        "🥝",
        "🌶️",
        "🦐",
        "🍗",
        "🥩",
        "🥚",
        "🥖",
        "🥯"
    ];

    /*生成35个蔬菜*/
    for(let i=0;i<35;i++){

        const emoji =
            veggies[
                Math.floor(
                    Math.random()*veggies.length
                )
            ];

        createVeggie(emoji);
    }

    /*摇一摇按钮*/
    document
        .getElementById("shakeBtn")
        .addEventListener("click", shakeVeggies);
}


/*创建一个蔬菜*/
function createVeggie(emoji){

    const Bodies = Matter.Bodies;
    const Composite = Matter.Composite;

    // 创建DOM
    const div = document.createElement("div");

    div.className = "veggie";

    div.innerHTML = emoji;

    document
        .getElementById("veggie-world")
        .appendChild(div);

    // 创建物理体
    const body = Bodies.circle(

        Math.random() * window.innerWidth,

        -100 - Math.random() * 500,

        35,

        {
            restitution: 0.7,
            friction: 0.05,

            render: {
                fillStyle: "transparent",
                strokeStyle: "transparent",
                lineWidth: 0
            }
        }
    );

    // 添加到世界
    Composite.add(world, body);

    // 保存
    veggieBodies.push({
        body: body,
        element: div
    });

    /*每一帧同步位置*/
    Matter.Events.on(
        engine,
        "afterUpdate",
        () => {

            div.style.left =
                (body.position.x - 18) + "px";

            div.style.top =
                (body.position.y - 18) + "px";

            div.style.transform =
                `rotate(${body.angle}rad)`;
        }
    );
}


/* 摇一摇*/
function shakeVeggies(){

    veggieBodies.forEach(item => {

        Matter.Body.applyForce(

            item.body,

            item.body.position,

            {
                x:(Math.random()-0.5)*0.05,
                y:-0.08
            }
        );

    });

}

document.addEventListener("DOMContentLoaded",()=>{

    const btn =
        document.getElementById("saveCardBtn");

    if(btn){

        btn.addEventListener(
            "click",
            generateShareCard
        );
    }

});

/*导出分享卡片*/
function generateShareCard(){

    /*复制食谱内容*/
    document.getElementById(
        "cardRecipe"
    ).innerHTML =
    document.getElementById(
        "recipeResult"
    ).innerHTML;


    /*复制营养文字*/
    document.getElementById(
        "cardNutritionText"
    ).innerHTML =
    document.getElementById(
        "nutritionText"
    ).innerHTML;


    /*复制ECharts图表*/
    const chartCanvas =
        document.querySelector(
            "#nutritionChart canvas"
        );

    if(chartCanvas){

        const img =
            chartCanvas.toDataURL(
                "image/png"
            );

        document.getElementById(
            "cardNutritionChart"
        ).innerHTML =

        `<img
            src="${img}"
            style="
                width:100%;
                margin-top:15px;
            "
        >`;
    }

        const compareCanvas =
        document.querySelector(
            "#nutritionCompareChart canvas"
        );

        if(compareCanvas){

            const img =
                compareCanvas.toDataURL(
                    "image/png"
                );

            document.getElementById(
                "cardNutritionCompareChart"
            ).innerHTML =

            `<img
                src="${img}"
                style="
                    width:100%;
                    margin-top:15px;
                "
            >`;
        }


    /*生成PNG*/
    html2canvas(
        document.getElementById(
            "shareCard"
        ),
        {
            scale:2
        }
    ).then(canvas=>{

        const link =
            document.createElement(
                "a"
            );

        link.download =
            "曦曦今日食谱.png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );

        link.click();

    });

}
